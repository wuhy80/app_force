name: Publish Windows release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/release-windows.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish, for example v0.1.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]]
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Windows x64 with frontend and embedded Agents
        run: make windows
      - name: Run host tests and static checks
        run: |
          make test
          go vet -tags with_quic,with_utls,with_gvisor ./...
      - name: Build Windows ARM64
        run: |
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -trimpath \
            -tags desktop,production,with_quic,with_utls,with_gvisor \
            -ldflags '-H windowsgui' -o bin/AppForce-arm64.exe ./cmd/appforce
      - name: Compile Windows tests for both architectures
        run: |
          for task_arch in amd64 arm64; do
            GOOS=windows GOARCH="$task_arch" CGO_ENABLED=0 go test -exec /usr/bin/true \
              -tags desktop,production,with_quic,with_utls,with_gvisor ./...
          done
      - name: Package binaries, corresponding source and licenses
        run: python3 scripts/package-windows.py --version "$RELEASE_TAG" --output output/release
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' > output/release-existing.txt 2> output/release-error.txt; then
            if [[ "$(cat output/release-existing.txt)" != true ]]; then
              echo 'This version is already published; refusing to replace release assets.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" output/release/assets/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "AppForce $RELEASE_TAG · Windows 桌面版" --notes-file output/release/release-notes.md
          else
            if ! grep -qi 'release not found' output/release-error.txt; then
              cat output/release-error.txt >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" output/release/assets/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "AppForce $RELEASE_TAG · Windows 桌面版" \
              --notes-file output/release/release-notes.md
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\")" > output/release/remote-release.json
          python3 scripts/package-windows.py --verify-remote output/release/remote-release.json --output output/release
          release_id=$(python3 -c 'import json; print(json.load(open("output/release/remote-release.json"))["id"])')
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -f make_latest=true --jq '.html_url'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-release-${{ env.RELEASE_TAG }}
          path: |
            output/release/assets/
            output/release/release-notes.md
            output/release/BUILD-INFO.json
          if-no-files-found: ignore
          retention-days: 14

  publish-existing-artifact:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Locate verified build artifact for current version
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))
          repository = os.environ['GITHUB_REPOSITORY']
          version = re.search(r'const Version = "([^"]+)"', pathlib.Path('internal/model/model.go').read_text()).group(1)
          tag = 'v'+version
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag)
          commit = subprocess.check_output(['git', 'rev-parse', f'refs/tags/{tag}^{{commit}}'], text=True).strip()
          artifacts = api(f'repos/{repository}/actions/artifacts?name=windows-release-{tag}&per_page=100')['artifacts']
          matches = [a for a in artifacts if a['name'] == 'windows-release-'+tag and not a['expired']
                     and a['workflow_run']['head_sha'] == commit]
          assert matches, 'No retained build artifact matches the version tag'
          artifact = max(matches, key=lambda a: a['created_at'])
          run_id = artifact['workflow_run']['id']
          required = {
              'Validate release tag', 'Build Windows x64 with frontend and embedded Agents',
              'Run host tests and static checks', 'Build Windows ARM64',
              'Compile Windows tests for both architectures', 'Package binaries, corresponding source and licenses'
          }
          jobs = api(f'repos/{repository}/actions/runs/{run_id}/jobs')['jobs']
          assert any(required <= {s['name'] for s in j['steps'] if s['conclusion'] == 'success'} for j in jobs), 'Build validation did not pass'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'run_id={run_id}\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'RELEASE_TAG={tag}\nRELEASE_COMMIT={commit}\n')
          print(f'Reusing verified {tag} build from run {run_id}, source {commit}')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-${{ env.RELEASE_TAG }}
          path: output/recovery
          github-token: ${{ github.token }}
          run-id: ${{ steps.build.outputs.run_id }}
      - name: Verify retained artifact and publish its draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          info = json.loads(pathlib.Path('output/recovery/BUILD-INFO.json').read_text())
          assert info['source_commit'] == os.environ['RELEASE_COMMIT']
          assert 'v'+info['version'] == os.environ['RELEASE_TAG']
          assert info['target_os'] == 'windows' and set(info['architectures']) == {'amd64', 'arm64'}
          PY
          (cd output/recovery/assets && sha256sum --check SHA256SUMS.txt)
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\")" > output/recovery/remote-release.json
          python3 scripts/package-windows.py --verify-remote output/recovery/remote-release.json --output output/recovery
          release_id=$(python3 -c 'import json; r=json.load(open("output/recovery/remote-release.json")); assert r["draft"], "Release is already published"; print(r["id"])')
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -f make_latest=true --jq '.html_url'
